################
### MONITORS ###
################

# See https://wiki.hypr.land/Configuring/Monitors/
monitor=,preferred,auto,auto
# monitor=,preferred,auto,1


###################
### MY PROGRAMS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/

# Set programs that you use
$terminal = kitty
$fileManager = nautilus
$menu = wofi --show drun -p Search --gtk-dark -i -a


#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
# exec-once = nm-applet &Uexec-once = waybar & hyprpaper & nm-applet
exec-once = waybar & nm-applet & blueman-applet &
exe-once = swaync
#exec-once = ~/bluetooth-connect.sh
exec-once = hyprpaper
exec-once = kitty -e bash -c "sleep 5 && /home/raj/bluetooth-connect.sh"
#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hypr.land/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

env = XCURSOR_SIZE,24
env = QT_SCALE_FACTOR,1
env = GDK_SCALE,1

